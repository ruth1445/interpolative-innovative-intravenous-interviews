<script>
(function(){
  function ensureJerry(){
    var nav=document.querySelector('.name-index');
    if(!nav) return false;
    if(nav.querySelector('a[href="#/p/jerry-bartolino"]')) return true;
    var a=document.createElement('a');
    a.className='name-oval';
    a.href='#/p/jerry-bartolino';
    a.textContent='jerry bartolino';
    var items=[].slice.call(nav.children);
    var before=items.find(function(el){
      return el.textContent.trim().localeCompare('jerry bartolino')>0;
    });
    nav.insertBefore(a,before||null);
    return true;
  }
  var tries=0;
  var timer=setInterval(function(){
    tries++;
    if(ensureJerry() || tries>40) clearInterval(timer);
  },100);
})();
</script>
