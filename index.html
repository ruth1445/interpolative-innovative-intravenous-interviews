<script type="module">
  import('/js/app.js?v=20261120readable').catch(err => {
    console.error('Interview site failed to load:', err);
    const host=document.getElementById('app');
    if(host) host.innerHTML='<div style="font:18px Georgia,serif;padding:3rem;max-width:38rem;margin:auto"><h1 style="font:24px Georgia,serif;margin-bottom:1rem">The interviews could not load</h1><p style="margin-bottom:1rem">Please reload this page. If the problem continues, the error below can help identify it:</p><pre id="site-error" style="white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace"></pre><p><a href="/">Back to homepage</a></p></div>';

    if(error) error.textContent=String(err && (err.stack || err.message) || err);
  });
</script>
<script>
(function(){
  function ensureJerry(){
    var nav=document.querySelector('.name-index');
    if(!nav) return false;
    if(nav.querySelector('a[href="#/p/jerry-bartolino"]')) return true;
    var a=document.createElement('a');
    a.className='name-oval';
    a.href='#/p/jerry-bartolino';
    a.textContent='jerry bartolino';
    var items=[].slice.call(nav.children);
    var before=items.find(function(el){
      return el.textContent.trim().localeCompare('jerry bartolino')>0;
    });
    nav.insertBefore(a,before||null);
    return true;
  }
  var tries=0;
  var timer=setInterval(function(){
    tries++;
    if(ensureJerry() || tries>40) clearInterval(timer);
  },100);
})();
</script>
