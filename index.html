/* Nothing here reaches the network. Both fonts on the page — Neue Montreal
   and Coal Hand Luke, plus Annonce if you switch the headline back — are
   carried inside this file as base64. Dancing Script and Quattrocento used
   to be linked from Google and were dropped once nothing used them; a page
   that quietly fetches a font is a page that breaks offline. */

/* ============================================================
   PALETTE
   ============================================================ */
:root{
  --grey:#EDE4D2;      /* beige, and nothing else on it */
  --grey-2:#CDCAC3;
  --card:#E7E4DD;
  --card-lift:#EFEDE7;
  --ink:#1C1C1A;       /* near-black — text, and the name bar */
  --blue:#3B5243;      /* deep sage — text accents (a pastel here would vanish) */
  --dim:#A9A498;
  --rule:#C6C1B6;
  /* the four plate pastels */
  --sage:#BFCFB4; --butter:#F0E4A8; --sky:#B6CBDE; --rose:#EAC4CB;
  --grot:'Helvetica Neue',Helvetica,Arial,'Inter',system-ui,sans-serif;
  --ui:'Arial Narrow','Helvetica Neue Condensed','Liberation Sans Narrow',
       Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  /* Georgia first: it was drawn for screens, so it stays legible at the
     size a short note wants to be read at */
  --note:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
  --body:'Neue Montreal','Helvetica Neue',Helvetica,Arial,sans-serif;
  /* the red handwriting: a marker pen, not a copperplate */
  /* The magazine look wants three faces the rest of the site never uses:
     a formal engraver's script for the kicker, a fat display serif for the
     shout, and a workhorse book serif for the columns. */
  /* No script face at all. A copperplate read as generated and a brush
     script wasn't wanted either, so the kicker is simply the display face
     in italic — which is what plenty of real advertisements did. Two faces
     on the page instead of three. */
  /* the kicker only; the foot of the page is a rule now, not words */
  --script:'Coal Hand Luke','Bradley Hand','Segoe Script','Chalkboard SE',
           cursive;
  /* back to where this started: a high-contrast display serif. Annonce is
     still embedded below if you want to flip back to it. */
  --shout:'Bodoni 72','Didot','Playfair Display','Times New Roman',Times,serif;
  /* for the card initials. Old English Text MT comes with Office, Luminari
     ships with macOS; both are medieval enough, and the Didot is a decent
     last resort. */
  --black:'Old English Text MT','UnifrakturMaguntia','Luminari',
          'Blackadder ITC','Bodoni 72','Didot',serif;
  /* what a magazine actually set text in around 1955: a Scotch or a
     Century, failing that the Times that replaced them everywhere */
  --press:'Century Schoolbook','New Century Schoolbook',
          'Iowan Old Style','Palatino Linotype',Palatino,
          'Times New Roman',Times,Georgia,serif;
  --ink-blue:#1E2A4A;
  --press-red:#B8242A;
  --paper:#F3EAD6;
  --hand:'Coal Hand Luke','Bradley Hand','Segoe Script','Chalkboard SE',
         'Comic Sans MS',cursive;
  --red:#DC4B33;       /* the pen the notes are written in */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--grey);color:var(--ink);
  font-family:var(--grot);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 30px}
.up{text-transform:uppercase;letter-spacing:.06em}
.micro{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em}

/* ============================================================
   THE BOUQUET — nothing else on the screen
   ============================================================ */
.field{
  height:100vh;            /* fallback */
  height:100svh;           /* the small viewport, so the URL bar can't crop it */
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:3.5vh 20px 0;
  padding-left:max(20px, env(safe-area-inset-left));
  padding-right:max(20px, env(safe-area-inset-right));
}

/* The search line's rules live with the rack, further down. There were
   older ones here, left over from the bouquet index, and they were still
   winning on the properties the new rule doesn't set — a 420px width and
   flex-direction:column, which turned `flex:1 1 200px` into a 200px tall
   input. Same trap as the .sheet collision: dead CSS from a design that
   was removed. */
#q::-webkit-search-cancel-button{-webkit-appearance:none}

.bouquet{
  position:relative;
  /* height-led, so the whole thing lands inside one screen */
  width:min(97vw, 98vh);
  aspect-ratio:1/1;
  margin-top:.8vh;
  flex-shrink:0;
}
.aboutlink{
  margin-top:1.1vh;flex-shrink:0;
  background:none;border:none;cursor:pointer;
  font-family:var(--ui);font-stretch:condensed;font-size:16px;
  color:#8A7A62;border-bottom:1px solid transparent;
  padding:0 0 2px;transition:color .25s ease,border-color .25s ease;
}
.aboutlink:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* the note: a florist's card, sitting slightly askew the way one does
   when it's tucked into a bunch */
/* the about card's backdrop. This was called .sheet too, and its rule —
   fixed, grid, place-items:center — was landing on the page sheets as
   well, shrinking their contents to max-content. Renamed so the two
   can't collide again. */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px}
.overlay[hidden]{display:none}
.scrim{
  position:absolute;inset:0;background:rgba(58,46,30,.34);
  opacity:0;transition:opacity .24s ease;
}
.card-about{
  position:relative;max-width:min(408px,90vw);
  background:var(--paper);
  border:1px solid var(--press-red);
  padding:34px 32px 28px;
  box-shadow:0 1px 0 rgba(120,100,66,.35), 0 22px 46px rgba(58,46,28,.22);
  opacity:0;transform:translateY(12px) rotate(-1.4deg) scale(.985);
  transition:opacity .24s ease,transform .34s cubic-bezier(.2,.7,.3,1);
}
.card-about::before{                       /* the printed rule inset from the edge */
  content:'';position:absolute;inset:9px;
  border:1px solid rgba(184,36,42,.78);pointer-events:none;
}
.overlay.on .scrim{opacity:1}
.overlay.on .card-about{opacity:1;transform:rotate(-1.4deg)}

.card-about p{
  font-family:var(--press);
  font-size:16.5px;line-height:1.72;color:#2E2A20;
  text-align:left;text-wrap:pretty;
}
.card-about p + p{margin-top:16px}
.card-about .sprig{display:block;margin:24px auto 0;width:46px;height:auto;color:#8FAE72}

.close{
  position:absolute;top:4px;right:8px;
  background:none;border:none;cursor:pointer;
  font-size:22px;line-height:1;color:#BCA981;padding:6px 8px;
  transition:color .2s ease;
}
.close:hover{color:#5C5136}

/* stems and leaves behind, flowers on top. No filters anywhere — the
   blur is what turned the paper and the greenery to mush. */
.stems,.leaves{
  position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  pointer-events:none;
}
.stems .stem{
  fill:none;stroke:#6E9A57;stroke-linecap:round;
  stroke-width:calc(var(--w,1) * 1px);vector-effect:non-scaling-stroke;
}
.leafshape{stroke:#3F5E32;stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.leafvein{fill:none;stroke:#3F5E32;stroke-width:.6;opacity:.45;vector-effect:non-scaling-stroke}

/* one bloom, one person.
   Each flower sits in a square box but is drawn as a circle inside it, so
   nearly 40% of the box is empty corner. Left hittable, those corners
   swallow the pointer and the wrong flower lights up — so the box takes no
   pointer events at all and only the painted petals do. */
.stalk{
  position:absolute;
  width:calc(18% * var(--s,1));
  transform:translate(-50%,-50%);
  transform-origin:50% 50%;
  pointer-events:none;
  z-index:1;
  /* the base rule is the way OUT: quick, so moving away feels immediate.
     z-index waits for the shrink to finish before it drops. */
  transition:transform .17s cubic-bezier(.3,.85,.4,1),
             opacity   .22s ease,
             z-index    0s .17s;
}
.bloom *{pointer-events:auto}
.bloom{display:block;width:100%;height:auto;overflow:visible;
  transform:rotate(var(--spin,0deg))}
/* No black outline anywhere — that one line is what made them read as
   clipart. A petal is edged in its own deeper tone instead, and lit from
   the throat outwards. */
.bloom .fl  {stroke:var(--vein,#9A8A78);stroke-width:1;stroke-opacity:.85;
             stroke-linejoin:round}
.bloom .vein{fill:none;stroke:var(--vein,#9A8A78);stroke-width:.85;
             stroke-linecap:round;opacity:.5}
.bloom .mid {fill:var(--throat,#C9A227)}
.bloom .dark{fill:var(--throat,#4A3A2A)}
.bloom .fil {fill:none;stroke:var(--inner,#FFF6D9);stroke-width:2;
             stroke-linecap:round;stroke-linejoin:round}
.bloom .anth{fill:#F8C93C;stroke:#C9930E;stroke-width:.4}
.bloom .stig{fill:var(--throat,#C4527E)}
.bloom .ln  {fill:none;stroke:var(--vein,#9A8A78);stroke-width:1;
             stroke-linecap:round;opacity:.5}
.bloom .sep {fill:#8CAF6B;stroke:#6F9153;stroke-width:.8;stroke-linejoin:round}

.stalk{cursor:pointer}
.stalk.quiet{cursor:default}          /* no page behind it yet */

/* and this is the way IN: a touch slower, and it comes to the front at once */
.stalk:hover,.stalk.shown{
  transform:translate(-50%,-50%) scale(1.13);
  z-index:9;
  transition:transform .26s cubic-bezier(.2,.7,.3,1),
             opacity   .22s ease,
             z-index    0s;
}
.stalk.shown .fname{opacity:1;transform:translateX(-50%) translateY(0)}

.fname{
  position:absolute;left:50%;bottom:100%;margin-bottom:8px;
  transform:translateX(-50%) translateY(4px);
  background:#fff;border:1px solid #2B2B28;border-radius:2px;
  padding:3px 9px;
  font-family:var(--ui);font-stretch:condensed;font-size:13px;
  color:#2B2B28;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .13s ease,transform .17s cubic-bezier(.3,.85,.4,1);
}
.stalk:hover .fname{
  opacity:1;transform:translateX(-50%) translateY(0);
  transition:opacity .2s ease .03s,transform .26s cubic-bezier(.2,.7,.3,1) .03s;
}

/* while you're searching, everything that isn't a match steps back */
.bouquet.searching .stalk{opacity:.2}
.bouquet.searching .stalk.hit{opacity:1;transform:translate(-50%,-50%) scale(1.13);z-index:8}
.bouquet.searching .stalk.hit .fname{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   A PERSON'S PAGE — text on the left, pictures on the right
   ============================================================ */
.article{padding:34px 0 120px}
.back{
  display:inline-block;
  font-family:var(--ui);font-stretch:condensed;font-weight:400;
  font-size:16px;letter-spacing:.01em;color:#8A7A62;
  border-bottom:1px solid transparent;padding-bottom:2px;
  transition:color .25s ease,border-color .25s ease;
}
.back:hover{color:var(--ink);border-bottom-color:var(--ink)}

.story{
  position:relative;                 /* caption boxes hang off this */
  max-width:1080px;
  margin-top:clamp(34px,5vh,64px);
}
.story::after{content:'';display:block;clear:both}   /* the float still counts */
.story p{
  font-family:var(--body);font-weight:500;font-feature-settings:'kern' 1;
  font-size:clamp(15.5px,1.1vw,17.5px);
  line-height:1.62;color:#1F1C15;text-wrap:pretty;
}
.story p + p{margin-top:1.55em}

/* the few colours worth having by name */
.story .red   {color:var(--red)}
.story .green {color:#5C8350}
.story .quiet {color:#8A8272}

/* the picture floats; its outer margin is where the note lives, and a
   margin is part of what text flows around, so the two never collide */
.fig{position:relative;width:var(--figw,42%)}
.fig.side-right{float:right;margin:4px 0 clamp(22px,3vh,34px) clamp(96px,14%,210px)}
.fig.side-left {float:left; margin:4px clamp(96px,14%,210px) clamp(22px,3vh,34px) 0}
.fig.side-full {float:none;width:100%;margin:clamp(26px,4vh,44px) 0}
.fig img{display:block;width:100%;height:auto}
.fig .ph{
  display:grid;place-items:center;aspect-ratio:3/4;padding:20px;text-align:center;
  background:#E3DAC6;border:1px dashed #B9A98A;
  font-family:var(--ui);font-stretch:condensed;font-size:14px;color:#8A7A62;
}

/* the handwritten aside sits wherever you put it, inside the picture or
   outside it */
.fig .note{
  position:absolute;left:var(--nx,-30%);top:var(--ny,52%);
  width:min(190px,26vw);
  font-family:var(--hand);color:var(--red);
  font-size:19px;line-height:1.24;
  transform:translate(-50%,-50%) rotate(var(--nrot,-4deg));
  z-index:3;
}
.fig.side-right .note{text-align:right}
.fig .arrowlayer{
  position:absolute;inset:0;width:100%;height:100%;
  overflow:visible;pointer-events:none;color:var(--red);z-index:2;
}

/* the crop: a window the picture sits behind, so you choose what shows */
.fig .crop{display:block;position:relative;overflow:hidden}
.fig .crop img{display:block;width:100%;height:100%;object-fit:cover;
  transform-origin:center;transition:transform .18s ease}
.fig .focal{
  display:none;position:absolute;width:18px;height:18px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(255,246,238,.85);border:2px solid var(--red);
  cursor:grab;touch-action:none;z-index:5;
}

/* a caption box, anywhere on the page */
.cap{
  position:absolute;z-index:6;
  transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  line-height:1.25;
}
.cap.tone-red  {color:var(--red)}
.cap.tone-green{color:#5C8350}
.cap.tone-ink  {color:var(--ink)}
.cap .captext{display:block;outline:none}
.article.editing .cap{outline:1px dashed #C6B392;outline-offset:6px}

/* handles, only while writing */
.fig .grip{
  display:none;position:absolute;left:50%;top:-20px;transform:translateX(-50%);
  font-style:normal;font-size:13px;line-height:1;
  background:var(--red);color:#FFF6EE;padding:3px 6px;border-radius:2px;
  cursor:grab;touch-action:none;user-select:none;
}
.fig .target{
  display:none;position:absolute;width:16px;height:16px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:#FFF6EE;border:2px solid var(--red);
  cursor:grab;touch-action:none;z-index:4;
}
.article.editing .fig .grip,
.article.editing .cap .grip,
.article.editing .fig .focal,
.article.editing .fig .target{display:block}
.article.editing .fig{outline:1px dashed #C6B392;outline-offset:6px}

/* ---- writing in the page ---- */
.writebtn{
  float:right;background:none;border:none;cursor:pointer;
  font-family:var(--ui);font-stretch:condensed;font-size:16px;
  color:#8A7A62;border-bottom:1px solid transparent;padding:0 0 2px;
  transition:color .25s ease,border-color .25s ease;
}
.writebtn:hover{color:var(--ink);border-bottom-color:var(--ink)}
.article.editing .writebtn{color:var(--red);border-bottom-color:var(--red)}

.tools{
  clear:both;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin-top:22px;padding:10px 12px;
  background:#F6F0E0;border:1px solid #D6C7A6;
  position:sticky;top:8px;z-index:30;
}
.tools button{
  font-family:var(--ui);font-stretch:condensed;font-size:14px;
  background:#FCF8ED;border:1px solid #D6C7A6;color:#4A4234;
  padding:4px 10px;cursor:pointer;transition:background .15s ease;
}
.tools button:hover{background:#EFE6CE}
.tools .t-red{color:var(--red)}
.tools .t-green{color:#5C8350}
.tools .t-go{background:#2F2A1F;border-color:#2F2A1F;color:#F6F0E0}
.tools .sep{width:1px;height:20px;background:#D6C7A6;margin:0 4px}
.tools .saved{
  font-family:var(--ui);font-stretch:condensed;font-size:13px;color:#7E9A63;
  min-width:34px;
}
.tools .saved.bad{color:var(--red);font-weight:700}
/* ============================================================
   THE FRONT
   A deliberately spare landing sheet: title, search, and about.
   ============================================================ */
.hand-page{
  --outer-y:clamp(18px,3vh,36px);
  --outer-x:clamp(14px,3vw,36px);
  width:100vw;max-width:100vw;
  height:100vh;height:100svh;
  padding:var(--outer-y) var(--outer-x);
  background:#FFFFFF;
  display:grid;place-items:center;
  overflow:hidden;
}
.hand-page .sheet{
  position:relative;display:block;width:min(1040px,100%);min-width:0;
  background:var(--paper);
  border:1px solid #16150F;
  padding:clamp(22px,3vw,44px) clamp(18px,3vw,42px) clamp(24px,3vw,40px);
  background-image:linear-gradient(180deg,
    rgba(255,252,244,.55) 0%, rgba(255,252,244,0) 28%,
    rgba(150,122,74,.05) 100%);
}
.hand-page .masthead{
  margin:0 0 clamp(12px,1.8vh,18px);
  font-family:var(--shout);font-weight:700;
  font-size:clamp(26px,4.1vw,50px);line-height:.94;
  letter-spacing:-.03em;color:var(--press-red);
  text-transform:uppercase;
}
.hand-page .searchrow{
  display:flex;flex-direction:row;width:auto;
  align-items:center;gap:14px;flex-wrap:nowrap;
  border-bottom:1px solid rgba(22,21,15,.55);
  padding-bottom:9px;margin-bottom:clamp(10px,1.6vh,18px);
}
.hand-page #q{
  flex:1 1 auto;width:auto;min-width:0;text-align:left;
  height:26px;line-height:26px;box-sizing:border-box;
  border:0;background:transparent;outline:none;-webkit-appearance:none;
  font-family:var(--press);font-size:clamp(14px,1.4vw,17px);
  color:#241F19;padding:0;margin:0;
}
.hand-page #q::placeholder{color:#9A8E76}
.hand-page .aboutlink{
  border:0;background:transparent;cursor:pointer;padding:0;
  font-family:var(--body);font-size:12.6px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:#6E6350;
}
.hand-page .aboutlink:hover{color:var(--press-red)}

/* ============================================================
   THE PRESS LOOK
   A page off a 1950s magazine: aged stock, an engraved script line
   setting up a fat red shout, a photograph pasted in slightly crooked
   with a torn edge, and the body set in narrow justified columns with
   a dropped initial. Everything is drawn — no images, no libraries.
   ============================================================ */
.press{
  min-height:100svh;min-height:100vh;
  padding:clamp(14px,3vw,44px) clamp(10px,3vw,40px) 70px;
  background:#FFFFFF;
  display:flex;justify-content:center;align-items:flex-start;
}
/* the sheet itself, and the two behind it */
.press .sheet{
  position:relative;display:block;width:min(1180px,100%);
  background:var(--paper);
  padding:clamp(24px,3.4vw,52px) clamp(20px,3.2vw,50px) clamp(30px,3vw,44px);
  border:1px solid #16150F;              /* an outline, not a shadow */
}

/* age: uneven foxing and a faint fibre, all in gradients */
/* Flat stock. There was a halftone dot and foxing here to suggest age,
   but a magazine page isn't textured — the paper is smooth and evenly
   coloured, and only the photographs carry a screen. The texture was
   reading as noise. All that's left is the faintest warmth towards the
   foot, the way ink and light age a page unevenly. */
.press .sheet{
  background-image:linear-gradient(180deg,
    rgba(255,252,244,.55) 0%, rgba(255,252,244,0) 28%,
    rgba(150,122,74,.05) 100%);
}

.press .back{
  display:inline-block;margin-bottom:clamp(10px,1.6vh,20px);
  font-family:var(--ui);font-stretch:condensed;font-size:13px;
  letter-spacing:.09em;text-transform:uppercase;
  color:#6E6350;text-decoration:none;border-bottom:1px solid #B9AC90;
}
.press .back:hover{color:var(--press-red);border-color:var(--press-red)}

/* ---- the top: the headline across the whole sheet ----
   The photographs used to sit in a column beside it, which left a dead
   stripe under the last line while the picture ran on. Now the headline
   takes the full measure and the writing starts directly beneath it. */
/* One flow, and one obvious path through it: read the headline, start at
   the top of the left column, work right. Splitting the opening paragraphs
   out beside the headline filled the space but made the reader hunt for
   where the piece begins, which is a worse problem than a quiet corner. */
.press .top{margin-bottom:clamp(10px,1.6vh,18px)}

/* AI in a joined-up hand is two letters nobody can read, so it borrows the
   display face and the red. */
.press .kicker .rd{
  font-family:var(--shout);font-style:normal;font-weight:700;
  color:var(--press-red);letter-spacing:-.03em;
  /* the same size as the headline underneath. line-height:0 keeps it from
     shoving the kicker's own line apart, and the small rise sits its caps
     on the script's baseline rather than floating them. */
  font-size:clamp(46px,7.2vw,98px);line-height:0;
  padding:0 .04em;vertical-align:-.06em;
}
.press .kicker{
  margin:0 0 .1em;
  font-family:var(--script);
  font-size:clamp(26px,3.9vw,54px);line-height:1.02;
  color:var(--ink-blue);font-style:normal;font-weight:400;
  letter-spacing:0;
}
.press .shout{
  margin:0;font-family:var(--shout);font-weight:700;
  font-size:clamp(46px,7.2vw,98px);line-height:.86;
  letter-spacing:-.03em;color:var(--press-red);
  text-transform:uppercase;
}
.press .shout .brk{display:block}

/* the photograph: pasted on crooked, edges torn */
.press .hero{
  margin:0;transform:rotate(1.6deg);
  filter:drop-shadow(0 6px 12px rgba(60,48,30,.34));
}
.press .hero .crop{
  display:block;width:100%;overflow:hidden;background:#DED2B6;
  aspect-ratio:4/5;                      /* a tall portrait would otherwise
                                            stretch the whole top band */
  clip-path:polygon(
    1.4% 2%, 16% .6%, 33% 2.4%, 51% .4%, 68% 2.6%, 84% .8%, 98.6% 2.4%,
    99.4% 18%, 98% 35%, 99.6% 52%, 97.8% 69%, 99.4% 85%, 98.2% 98%,
    83% 99.4%, 66% 97.6%, 49% 99.6%, 32% 97.4%, 15% 99.4%, 1.8% 97.8%,
    .6% 84%, 2% 67%, .4% 50%, 2.2% 33%, .6% 17%);
}
.press .hero img{display:block;width:100%;height:100%;object-fit:cover}
.press .hero figcaption{
  margin-top:7px;font-family:var(--ui);font-stretch:condensed;
  font-size:11.6px;letter-spacing:.09em;text-transform:uppercase;
  color:#5C5342;
}

/* ---- photographs in among the writing --------------------------------
   Each one sits in the column flow and refuses to be split across a
   column break, so the text simply runs around it. The wide one spans all
   three columns; the other two take a single column each. */
.press .cols .plate{
  position:relative;display:block;margin:0 auto 1.05em;
  break-inside:avoid;page-break-inside:avoid;
}
.press .cols .plate.wide{
  column-span:all;margin:.4em 0 1.1em;
}
.press .cols .shot{
  display:block;position:relative;height:0;   /* the height is written in */
  overflow:hidden;background:#E4D9BE;
  /* a photograph printed on a page doesn't cast a shadow either */
  border:1px solid rgba(18,17,12,.85);
}
.press .cols .shot img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
/* written straight onto the photograph, in the marker pen */
.press .cols .mark{
  position:absolute;inset:0;width:100%;height:100%;
  overflow:visible;pointer-events:none;z-index:2;
}
.press .cols .mark path{
  fill:none;stroke:var(--press-red);stroke-width:.7;
  stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.press .cols .scribble{
  position:absolute;z-index:3;pointer-events:none;
  font-family:var(--hand);color:#FFFFFF;
  font-size:clamp(9px,.86vw,12px);line-height:1.16;
  /* the columns are justified and the note was inheriting it, which spread
     the words right across the picture */
  text-align:left;max-width:60%;
  transform:rotate(-4deg);transform-origin:0 0;
  /* flat white marker text: no glow or shadow */
  text-shadow:none;
}

/* the caption, under its photograph where a magazine puts it */
.press .cols .bub{
  display:block;margin-top:6px;text-align:center;
  font-family:var(--ui);font-stretch:condensed;
  font-size:10.6px;line-height:1.3;
  letter-spacing:.1em;text-transform:uppercase;color:#5A5140;
}
@media(max-width:900px){
  .press .cols .plate{margin-left:auto;margin-right:auto}
  .press .cols .plate.wide{column-span:none}
  .press .cols .bub{font-size:11px}
}

/* ---- the body, in columns ---- */
.press .cols{
  column-count:3;column-gap:clamp(20px,2.4vw,34px);
  column-rule:1px solid rgba(120,96,58,.30);
  padding-top:clamp(6px,1vh,12px);
  text-align:justify;hyphens:auto;
}
/* the dropped initial */
.press .cols p:first-of-type::first-letter{
  float:left;font-family:var(--shout);font-weight:700;
  font-size:4.85em;line-height:.735;
  margin:.02em .09em -.04em 0;color:var(--press-red);
}
.press .cols p{
  margin:0 0 .72em;font-family:var(--press);
  font-size:clamp(13px,1.08vw,15.6px);line-height:1.45;
  color:#241F19;
}

.press .cols em{font-style:italic}
/* a link in the writing: the red of the page, underlined thinly so it
   reads as a link without shouting */
.press .cols a[href]{
  color:var(--press-red);text-decoration:none;
  border-bottom:1px solid rgba(184,36,42,.45);
}
.press .cols a[href]:hover{border-bottom-color:var(--press-red)}
/* while you're writing, a link shows its own outline so you can see it */
.press.editing .cols a[href]{
  background:rgba(184,36,42,.09);border-radius:2px;
  box-shadow:0 0 0 1px rgba(184,36,42,.3);
}
/* the essay layout too */
.story a[href]{
  color:var(--red);text-decoration:none;
  border-bottom:1px solid rgba(220,75,51,.45);
}
.story a[href]:hover{border-bottom-color:var(--red)}

/* a caption box becomes a boxed recipe panel */
.press .cols .cap,
.press .cap{
  position:static!important;width:auto!important;
  break-inside:avoid;margin:0 0 1em;padding:9px 11px 10px;
  border:1px solid var(--ink-blue);
  transform:none!important;text-align:left;
}
.press .cap .captext{
  font-family:var(--ui);font-stretch:condensed;font-size:12.4px;
  line-height:1.34;letter-spacing:.045em;text-transform:uppercase;
  color:var(--ink-blue);
}

/* a picture inside the columns: small, boxed, with its note beneath */
.press .cols .fig{
  float:none;width:100%!important;margin:0 0 1em;break-inside:avoid;
}
.press .cols .fig .crop{display:block;width:100%;border:1px solid rgba(60,48,30,.4)}
.press .cols .fig img{display:block;width:100%}
.press .cols .fig .note{
  position:static;display:block;width:auto;margin:5px 0 0;
  transform:none;text-align:left;
  font-family:var(--ui);font-stretch:condensed;font-size:11.4px;
  letter-spacing:.07em;text-transform:uppercase;color:#5C5342;
}
.press .fig .arrowlayer,.press .fig .target,.press .fig .focal{display:none}

/* ---- the foot of the page ----
   No words down here any more. One hairline, centred, stopping well short
   of both edges — the article simply stops. */
.press .colophon{
  margin-top:32px;text-align:center;line-height:0;
}
/* the rule itself is an inline-block centred by text-align, rather than a
   block centred by margin:auto — an empty block sitting straight after a
   multi-column element is where layout engines disagree */
.press .colophon::before{
  content:'';display:inline-block;vertical-align:top;
  width:38%;max-width:420px;height:0;
  border-top:1px solid rgba(22,21,15,.55);
}
@media(max-width:900px){
  .press .colophon{margin-top:24px}
  .press .colophon::before{width:60%}
}

@media(max-width:900px){
  .press{padding:10px 8px 60px;background:#FFFFFF}
  .press .shout{font-size:clamp(38px,12.5vw,80px)}
  .press .kicker{font-size:clamp(24px,7.4vw,40px)}
  .press .shout{max-width:none}
  .press .cols{column-count:1;text-align:left;hyphens:manual}
  .press .cols p{font-size:15.5px;line-height:1.52}
  /* a single narrow column can't carry a five-line initial */
  .press .cols p:first-of-type::first-letter{font-size:3.5em;line-height:.78}
}
@media(min-width:901px) and (max-width:1180px){
  .press .cols{column-count:2}
}

/* ============================================================
   HANDLING THINGS DIRECTLY
   In write mode a picture and a caption are objects, not settings.
   Click one and it gets a ring and corner handles. Drag it to move it.
   Drag a corner to resize it. Double-click a picture to crop it — then
   dragging inside pans the picture behind the frame and the bottom edge
   changes how tall the frame is. Double-click a caption to type in it.
   ============================================================ */
.article.editing .fig,
.article.editing .cap{ cursor:grab; }
.article.editing .fig.dragging,
.article.editing .cap.dragging{ cursor:grabbing;opacity:.72; }

.article.editing .fig::after,
.article.editing .cap::after{
  content:'';position:absolute;inset:-6px;pointer-events:none;
  border:1.5px dashed transparent;border-radius:3px;transition:border-color .12s;
}
.article.editing .fig:hover::after,
.article.editing .cap:hover::after{ border-color:#C4B79A; }
.article.editing .fig.picked::after,
.article.editing .cap.picked::after{ border-color:var(--red);border-style:solid; }

/* the little squares at the corners */
.hand{
  position:absolute;width:11px;height:11px;background:#fff;
  border:1.5px solid var(--red);border-radius:2px;z-index:6;display:none;
  touch-action:none;
}
.article.editing .picked > .hand{ display:block; }
@media(max-width:900px){ .hand{display:none!important} }
.hand.se{ right:-9px;bottom:-9px;cursor:nwse-resize; }
.hand.sw{ left:-9px;bottom:-9px;cursor:nesw-resize; }
.hand.ne{ right:-9px;top:-9px;cursor:nesw-resize; }
.hand.nw{ left:-9px;top:-9px;cursor:nwse-resize; }

/* where it will land when you let go */
.dropline{
  height:0;border-top:2.5px solid var(--red);margin:0;padding:0;
  list-style:none;pointer-events:none;
}

/* crop mode: the frame stays, the picture moves behind it */
.fig.cropping{ cursor:move; }
.fig.cropping .crop{ outline:2px solid var(--red);outline-offset:2px; }
.fig.cropping .crop img{ opacity:1; }
.fig.cropping .cropbar{
  position:absolute;left:0;right:0;bottom:-5px;height:11px;cursor:ns-resize;
  z-index:7;touch-action:none;
}
.fig.cropping .cropbar::before{
  content:'';position:absolute;left:50%;bottom:3px;width:46px;height:5px;
  transform:translateX(-50%);background:var(--red);border-radius:3px;
}
.crophint{
  position:absolute;left:0;top:-26px;z-index:7;white-space:nowrap;
  font-family:var(--ui);font-stretch:condensed;font-size:12px;
  background:var(--red);color:#fff;padding:2px 7px;border-radius:2px;
}
.article.editing .fig .focal{ display:none; }
.fig.cropping .focal{ display:block!important; }

.warn{
  clear:both;margin:10px 0 0;padding:10px 12px;max-width:760px;
  border:1px solid var(--red);border-radius:3px;background:#FBEDE9;
  font-family:var(--ui);font-stretch:condensed;font-size:13px;line-height:1.45;
  color:#8C3423;
}
.warn b{font-weight:700}
.kept{
  clear:both;margin-top:14px;
  font-family:var(--ui);font-stretch:condensed;font-size:13.5px;color:#9A8A6C;
}

#codebox{
  display:block;width:100%;min-height:190px;margin-top:12px;
  font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:#2F2A1F;color:#EDE3C8;border:none;padding:14px;resize:vertical;
}
#codebox[hidden]{display:none}

.article.editing .story p:hover,
.article.editing .note:hover{outline:1px dashed #C6B392;outline-offset:4px}
.article.editing [contenteditable]:focus{
  outline:2px solid var(--red);outline-offset:4px;
}

/* ---- on a phone ---- */

  .article{padding:26px 0 90px}
  .story{margin-top:26px}
  /* a floated picture in a narrow column leaves slivers of text, so

  .fig,.fig.side-right,.fig.side-left,.fig.side-full{

        { img:'siddharth-rooftop.jpg', ar:0.75, after:2, fx:32, fy:45, w:88,

    /* ------------------------------------------------------------------

         <em>slanted</em>          <strong>heavy</strong>

    story:[
      { img:'siddharth-rooftop.jpg',
        alt:'Siddharth leaning on the parapet of the Verci rooftop, the Met Life tower and the Empire State behind him',
        note:'on the verci rooftop, looking down',
        side:'right', ratio:'4/5', fx:34, fy:58, zoom:1,
        nx:-34, ny:58, nrot:-4,
        tx:11, ty:65 },

      { p:`Siddharth has said this twice now. Once on Twitter, once to me on a
           rooftop in New York City. I met plenty of design engineers and product
           designers in nyc this summer and heard many such hot takes. Siddharth, however, is not limited to such corporate labels.
           <em>Designer</em> is a roomier title. I think even that&rsquo;s too small for

      { p:`I first met him at Verci, where he presented <em><a href="https://itsiddharth.design/calculatedcamouflage" target="_blank" rel="noopener">Calculated
           Camouflage</a></em>. Exactly a week later, I was back in Verci, at roughly
           the same time, except now we were on the rooftop and I was trying to
           pick his brain. Here's everything I learnt from him.` },

      { p:`I&rsquo;d been trying to design more myself but no two of my pieces
           seemed like they came from the same person. Siddharth&rsquo;s solution
           was to simply keep making more things. One of his recurring exercises
           is to put on a movie or show he knows well in the background, sometimes
           <em>Arrival</em>, sometimes <em>Suits</em>, while he makes a poster.
           He&rsquo;s made enough of them to maybe have his own catalogue by now.` },

      { p:`The more you create, the more data you own to notice patterns in. You
           can clearly see what works for you and how your personal style
           progresses. He challenged himself to design his <a href="https://www.timecapsule.co.in" target="_blank" rel="noopener">blog</a> within the theme
           he picked for it. He does not particularly believe in thinking outside
           the box. He would much rather define the box and sit inside it. I liked
           this a lot because it made me realize how much I was asking from myself
           by trying to create on a blank screen each time. Having constraints
           actually allows for more creative freedom. Hopefully, I let this
           philosophy bleed into all aspects of my life as I keep creating every
           day.` },

      { p:`A delightful consequence of doing the same thing every day is that it
           gives you these little skills you might not initially have expected to
           gain. Siddharth has given so much of his time to creating that now, he
           can easily tell when gaps are uneven or if something is off-center.
           Don&rsquo;t even get him started on lighting that is too orange or too
           white. His eyes are far too trained to entertain visual imbalance.
           Additionally, he might be the first designer I have met who did not
           diss Canva. He might also be the first designer I&rsquo;ve spoken to
           that didn&rsquo;t feel strongly about limiting screen time. Social media
           is rife with inspiration but only if you put in the work to make it so.
           He abuses the mute button on anything that displeases him. His feeds are
           tuned to a T and even his saved posts get checked and cleaned out
           regularly. That's quite the alternative to guilt tripping 
           yourself and quitting cold turkey.` },

      { p:`I have been obsessed with understanding what constant building
           does to the brain. The process of creating is far more thrilling than
           the final product. For Siddharth, the process is sacred. The finished
           product belongs to everyone for it is now theirs to shower with awe,
           jest, ridicule, and anything else their heart desires. But only the
           process is all his. Even letting someone else too far into the process
           can feel intrusive. Posting the finished thing, on the other hand,
           brings him closure because once it is out there, that&rsquo;s its final
           form. It saves himself any nitpicking and he can now move on to other work.` },

      { p:`What we feel in our minds and hearts may largely inspire what we create
           with our hands. Siddharth says the massiveness of huge canvases, sculptures, 
           and giant movie screens all leave him with a visceral feeling. I admitted 
           how I love feeling small in front of big buildings too. I think the primary 
           feeling evoked is wonder, which I believe to be very useful in the creative
           process. Another awesome way to create is to be so deeply immersed in
           two different fields that you start seeing connections that most others
           might overlook. Johannes Kepler was an astronomer, mathematician,
           musical theorist, and as a byproduct, a philosopher. How elegantly
           <em>Harmonices Mundi</em> ties geometry, music theory, and astronomy
           together will bring a tear to your eye. Another example is
           Siddharth&rsquo;s <a href="https://itsiddharth.design/playground-page" target="_blank" rel="noopener">medieval brat poster</a>. The Brat epidemic from 2 summers
           ago affected millions including him and he just had to get it out of his
           system by making the poster. This is only one of the many many occasions in 
           which art has proved to be cathartic for him.` },

      { p:`Now, at this point in any conversation where I&rsquo;ve related to the
           person this much, I know it&rsquo;s time to bring up Anthony Bourdain
           (he finds his way into all my conversations). And just as I suspected,
           he was also a fan and coincidentally, on his way to watch Tony that very
           night! We jumped between movies, I told him about the Metrograph, and we
           even spoke about how NYC today looks very different from the
           representations in movies (like <em>Marty Supreme</em>; early 50s) and
           television shows (<em>Seinfeld</em>; late 80s to late 90s). The spirit of
           NYC, however, is immortal. When Siddharth wore his Hot Wheels jacket in
           SF, it didn&rsquo;t receive the love that NYC would have given it. It has
           been about 2 weeks since I&rsquo;ve been itching to fly to SF just for
           the events. I have decided that I will now be flying there with a much
           lighter suitcase.` },

      { p:`We then reflected on the influence that people can have on us. His roommate
           was a sculptor who came from a privileged family but still cleaned
           toilets at Popeyes to put himself through art school! And on the other
           end of the spectrum, there are friends and acquaintances, sometimes even
           from only a couple of years ago, whom we can&rsquo;t really talk to
           anymore. I say can&rsquo;t because it feels like we cannot hold a
           conversation with them or relate to them anymore. He described some of
           them as feeling &ldquo;frozen in time&rdquo; because our rates of growth
           no longer match.` },

      { p:`One of my greatest fears is stagnation. I like people who are willing to
           be beginners, to look stupid, to change their minds, and to experience
           discomfort. There is enormous joy on the other end of that discomfort.
           Siddharth would happily let AI take his job if it meant he could make art
           full-time. Part of why I commented on his appetite for life is because it
           is huge. He studied engineering and then went to art school. He could be a 
           student for all his life (what a wonderful mindset!). He prioritizes personal 
           growth over monetary gain. He&rsquo;s open to new foods and he loves film. He 
           is fascinated by math and science. He has tasteful opinions on album art. If 
           he&rsquo;s not making posters, he&rsquo;s making rings. If he&rsquo;s not making

           worldview does not come from sitting in your bedroom and living the same life every 
           day. He is not afraid to experiment and knows that beginner embarrassment is incidental
           to gaining new experiences.

           you can <a href="https://x.com/itsiddharth_" target="_blank" rel="noopener noreferrer">reach</a> out to him yourself!` }

/* deterministic per-slug pseudo-random, so the scatter never jumps around */
function rng(seed){
  let h=2166136261;
  for(const ch of seed){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); }
  return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; };

  ['#7E9E2A','#F2F7DC','#DCEAB4','#EAF2CE','#A8BE7E'],  // pale green
  ['#4A6E1A','#B4D48A','#8ABE5C','#B0D086','#5E7E2E']   // sage
];

/* Phyllotaxis: the arrangement a real flower head uses. Every point sits
   the same distance from its neighbours, which is exactly what "no gaps"
   requires — a random scatter always leaves holes. */
function bouquetLayout(n){
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  return [...Array(n)].map((_,i)=>{
    const r = rng('pack'+i);
    const t = Math.sqrt((i + 0.5) / n);
    const a = i * GOLDEN;
    return {
      x: CLUSTER.cx + Math.cos(a)*CLUSTER.rx*t + (r()-0.5)*1.6,
      y: CLUSTER.cy + Math.sin(a)*CLUSTER.ry*t + (r()-0.5)*1.6,
      s: (1.08 - t*0.16) * (0.96 + r()*0.08),      // middle heads a little larger
      t, a
    };
  }).sort((p,q)=> q.t - p.t);                       // rim first, centre last
}

/* small leaves tucked into the spaces between heads */
function leafFill(n){
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const bits = [...Array(n)].map((_,i)=>{
    const r = rng('leaf'+i);
    const t = Math.sqrt((i + 0.5) / n) * 1.06;
    const a = i * GOLDEN + 0.8;
    const x = CLUSTER.cx + Math.cos(a)*CLUSTER.rx*t;
    const y = CLUSTER.cy + Math.sin(a)*CLUSTER.ry*t;
    const L = 7 + r()*5, w = 2.6 + r()*1.4;
    const g = ['#8FBB6E','#6F9E57','#A6C98A'][Math.floor(r()*3)];
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(r()*360).toFixed(0)})">
      <path d="M0 0 C${w} ${-L*.3} ${w*.8} ${-L*.72} 0 ${-L.toFixed(1)}
               C${-w*.8} ${-L*.72} ${-w} ${-L*.3} 0 0 Z" fill="${g}" class="leafshape"/>
      <path d="M0 -1 L0 ${(-L+1.5).toFixed(1)}" class="leafvein"/></g>`;
  }).join('');
  return `<svg class="leaves" viewBox="0 0 100 100" preserveAspectRatio="none">${bits}</svg>`;
}

/* long stems, gathered */
function stemArt(spots){
  /* A square bouquet can't fill a tall phone, so the box stops short of the
     bottom. Run the stems further past it there and the screen edge still
     does the cutting. */
  const gx = GATHER[0];
  const gy = ((typeof window !== 'undefined' && window.innerWidth) || 1440) < 820 ? 132 : GATHER[1];
  const lower = spots.filter(sp=>sp.y > CLUSTER.cy - 2);
  const stems = lower.map((sp,i)=>{
    const r = rng('stem'+i);
    const bend = (sp.x - gx) * 0.45;
    return `<path d="M${sp.x.toFixed(1)} ${sp.y.toFixed(1)}
             C${(sp.x - bend*0.25).toFixed(1)} ${(sp.y+14).toFixed(1)}
              ${(gx + bend*0.30).toFixed(1)} ${(gy-22).toFixed(1)}
              ${gx} ${gy}" class="stem" style="--w:${(0.8+r()*0.7).toFixed(2)}"/>`;
  }).join('');

  const sprigs = lower.filter((_,i)=>i%3===1).map((sp,i)=>{
    const r = rng('sl'+i);
    const my = sp.y + 16 + r()*20;
    const mx = sp.x + (gx - sp.x)*((my - sp.y)/(gy - sp.y)) * 0.9;
    const dir = mx < gx ? -1 : 1;
    const L = 5 + r()*4;
    return `<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)}) rotate(${(dir*58 + (r()-0.5)*24).toFixed(0)})">
      <path d="M0 0 C${2.4*dir} ${-L*.3} ${2*dir} ${-L*.7} 0 ${-L.toFixed(1)}
               C${-2*dir} ${-L*.7} ${-2.4*dir} ${-L*.3} 0 0 Z" fill="#7FAD64" class="leafshape"/></g>`;
  }).join('');

  return `<svg class="stems" viewBox="0 0 100 100" preserveAspectRatio="none">${stems}${sprigs}</svg>`;
}


/* ---- the blooms ----
   Six shapes that stay legible at the size they're actually drawn. Flat
   colour, black line, nothing clever. */

/* ---- the blooms ----
   Built from the reference: broad ruffled petals, a throat that contrasts,
   veins running out from the middle, and a stamen column standing proud of
   the face. Every petal is filled with the flower's own radial wash, so the
   colour deepens into the centre the way it does on a real one. */

/* one petal, pointing up from the middle, ruffled along its outer edge */
const P = {
  /* hibiscus: a broad fan, widest near the tip, ruffled across the top —
     five of these at 72° just meet, which is what makes them read as five
     petals instead of one lump */
  broad: `M50 50 C42 43 31 33 28 22
          C25 13 32 6 39 9 C43 10 44 5 50 5
          C56 5 57 10 61 9 C68 6 75 13 72 22
          C69 33 58 43 50 50 Z`,
  /* lily: narrow, pointed, curling back */
  spear: `M50 50 C40 41 34 24 44 6 C46 2 54 2 56 6
          C66 24 60 41 50 50 Z`,
  /* gerbera: a slim tongue with a rounded tip */
  ray:   `M50 50 C45 43 43 27 45 14 C46 8 54 8 55 14
          C57 27 55 43 50 50 Z`,
  /* dahlia: pointed, folded down the middle */
  quill: `M50 50 C44 41 41 25 50 8 C59 25 56 41 50 50 Z`,
  /* rounded and overlapping — camellia, ranunculus, pompom */
  round: `M50 50 C37 47 29 38 31 27 C33 17 41 11 50 14
          C59 11 67 17 69 27 C71 38 63 47 50 50 Z`
};

const ring = (n, d, off=0, scale=1) => [...Array(n)].map((_,i)=>
  `<path d="${d}" class="fl" transform="rotate(${(i*(360/n)+off).toFixed(1)} 50 50)${
    scale!==1 ? ` translate(50 50) scale(${scale}) translate(-50 -50)` : ''}"/>`).join('');

const veins = (n, len, off=0) => [...Array(n)].map((_,i)=>
  `<path d="M50 46 C50 ${(50-len*0.45).toFixed(0)} 50 ${(50-len*0.7).toFixed(0)} 50 ${(50-len).toFixed(0)}"
     class="vein" transform="rotate(${(i*(360/n)+off).toFixed(1)} 50 50)"/>`).join('');

/* the column of stamens a hibiscus carries out in front of its face.
   Small and thin it just disappears at the size these are drawn, so it is
   deliberately bold. */
const column = (len=32) => `
  <g transform="rotate(-20 50 50)">
    <path d="M50 48 C50 ${(50-len*0.4).toFixed(0)} 49 ${(50-len*0.75).toFixed(0)} 47.5 ${(50-len).toFixed(0)}" class="fil"/>
    ${[...Array(8)].map((_,i)=>{
      const t = 0.44 + i*0.075, a = (i%2 ? 1 : -1) * (3 + i*0.5);
      const y = 50 - len*t, x = 50 + a;
      return `<path d="M${(50-(50-x)*0.3).toFixed(1)} ${(50-(50-y)*0.7).toFixed(1)}
                       L${x.toFixed(1)} ${y.toFixed(1)}" class="fil"/>
              <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.1" class="anth"/>`;
    }).join('')}
    ${[...Array(5)].map((_,i)=>{
      const a = (i-2)*0.42, x = 47.5 + Math.sin(a)*4.6, y = 50-len + Math.cos(a)*1.4 - 2.4;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" class="stig"/>`;
    }).join('')}
  </g>`;

const BLOOMS = {
  /* the shape that runs right through her reference */
  poppy: ()=>`
    ${ring(5, P.broad, 18)}
    ${veins(5, 36, 18)}
    ${[...Array(5)].map((_,i)=>
      `<path d="M50 47 C45 39 42 30 43 21 M50 47 C55 39 58 30 57 21"
        class="vein" transform="rotate(${i*72+18} 50 50)" opacity=".34"/>`).join('')}
    ${column(33)}`,

  /* a second hibiscus, petals turned the other way and a shorter column */
  cosmos: ()=>`
    ${ring(5, P.broad, -16, 0.96)}
    ${veins(5, 33, -16)}
    ${column(28)}`,

  /* gerbera: two rings of rays around a packed disc */
  daisy: ()=>`
    ${ring(16, P.ray, 0)}
    ${ring(16, P.ray, 11.25, 0.76)}
    <circle cx="50" cy="50" r="13" class="mid"/>
    ${[...Array(26)].map((_,i)=>{
      const t = Math.sqrt((i+0.5)/26), a = i*2.399963;
      return `<circle cx="${(50+Math.cos(a)*11.5*t).toFixed(1)}"
                      cy="${(50+Math.sin(a)*11.5*t).toFixed(1)}"
                      r="1.6" class="anth" opacity=".85"/>`;}).join('')}`,

  /* lily: six pointed petals, freckled throat, stamens out front */
  tulip: ()=>`

    ${veins(6, 36)}
    ${[...Array(16)].map((_,i)=>{
      const r0 = rngv(i), a = i*2.399963, t = Math.sqrt((i+0.5)/16);
      return `<circle cx="${(50+Math.cos(a)*14*t).toFixed(1)}"
                      cy="${(50+Math.sin(a)*14*t).toFixed(1)}"
                      r="${(1+r0*0.6).toFixed(1)}" class="stig" opacity=".6"/>`;}).join('')}
    ${column(28)}`,

  /* camellia: rounded petals folding in, each ring turned off the last */
  rose: ()=>`
    ${ring(7, P.round, 0)}
    ${ring(6, P.round, 26, 0.68)}
    ${ring(5, P.round, 12, 0.4)}
    <circle cx="50" cy="50" r="3.4" class="mid"/>`,

  /* dahlia: three rings of quills, tight eye */
  aster: ()=>`
    ${ring(13, P.quill, 0)}
    ${ring(13, P.quill, 13.8, 0.74)}
    ${ring(9, P.quill, 6, 0.46)}
    <circle cx="50" cy="50" r="4.6" class="mid"/>`,

  /* ranunculus: small rounded petals wound tight */
  ranunculus: ()=>`
    ${ring(8, P.round, 0)}
    ${ring(8, P.round, 22, 0.7)}
    ${ring(6, P.round, 11, 0.44)}
    <circle cx="50" cy="50" r="3" class="mid"/>`,

  /* pompom dahlia: a dense ball of little petals */
  pom: ()=>`
    ${ring(11, P.round, 0, 0.94)}
    ${ring(11, P.round, 16, 0.66)}
    ${ring(8,  P.round, 8,  0.42)}
    <circle cx="50" cy="50" r="2.6" class="mid"/>`,

  /* Still closed, and smaller than an open flower, because that is what a
     bud is. Levelling it to the same size as the blooms turned the page

  bud: ()=>`
    <path d="M50 12 C63 24 69 44 65 61 C61 76 56 86 50 88
             C44 86 39 76 35 61 C31 44 37 24 50 12 Z" class="fl"/>
    <path d="M50 12 C60 32 61 60 53 87" class="ln" opacity=".5"/>
    <path d="M50 12 C40 32 39 60 47 87" class="ln" opacity=".5"/>
    <path d="M37 40 C45 48 48 62 48 88" class="ln" opacity=".3"/>
    <path d="M63 40 C55 48 52 62 52 88" class="ln" opacity=".3"/>`

/* a scrap of noise for the lily freckles, so they don't sit in a lattice */
function rngv(i){ const x = Math.sin(i*127.1)*43758.5453; return x - Math.floor(x); }

const BLOOM_KEYS = ['daisy','cosmos','poppy','tulip','rose',
                    'daisy','cosmos','poppy','rose','bud'];

/* Shape and colour are chosen against the neighbours rather than at
   random, so no two touching flowers are the same. Each person keeps a
   seeded order of preference and takes the first one nobody beside them
   has already used; if every option is taken, whichever is rarest wins. */
const SHAPES = ['daisy','cosmos','poppy','tulip','rose','bud','aster','ranunculus','pom'];

/* how much of its 100-unit box each shape actually fills, inverted — so
   every flower ends up the same size on the page and none leaves a hole */
/* measured from each shape's own markup, not guessed */
const SHAPE_FIT = {
  poppy:1.01, cosmos:1.06, daisy:1.14, tulip:1.00, rose:1.20,
  aster:1.15, ranunculus:1.20, pom:1.28, bud:0.80
};

function assignBlooms(spots, people){
  const shape = [], colour = [];
  /* A colour asked for by name is held back — but only from flowers near
     enough to be confused with it. Reserving all six across the whole bunch
     left too few colours for everyone else, and neighbours started
     repeating. */
  const claims = (people||[]).map((p,i)=>
    (p && p.colour !== undefined) ? {i, c:p.colour} : null).filter(Boolean);
  const freeFor = i => {
    const near = new Set(claims
      .filter(cl => cl.i !== i && Math.hypot(spots[cl.i].x-spots[i].x, spots[cl.i].y-spots[i].y) < 34)
      .map(cl => cl.c));
    return [...PALETTE.keys()].filter(k => !near.has(k));
  };
  const shuffled = (arr, r)=>{
    const a = arr.slice();
    for(let k=a.length-1;k>0;k--){ const j=Math.floor(r()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
    return a;
  };
  const pick = (pref, near, taken)=>{
    const free = pref.find(v=>!near.includes(v));
    if(free !== undefined) return free;
    const count = v => near.filter(x=>x===v).length;      // fall back to rarest
    return pref.slice().sort((a,b)=>count(a)-count(b))[0];
  };
  spots.forEach((sp,i)=>{
    const r = rng('assign'+i);
    const nb = [];
    for(let j=0;j<i;j++)
      if(Math.hypot(spots[j].x-sp.x, spots[j].y-sp.y) < 24) nb.push(j);
    const want = people[i] || {};
    /* no name yet, no bloom yet */
    shape[i]  = (want.soon && !want.named) ? 'bud'
              : want.shape !== undefined   ? want.shape
              : pick(shuffled(SHAPES, r),              nb.map(j=>shape[j]));
    colour[i] = want.colour !== undefined ? want.colour
              : pick(shuffled(freeFor(i), r),          nb.map(j=>colour[j]));
  });
  return {shape, colour};
}

const BUD = '#C9D8B2';           // every unopened one, the same soft green

function flower(p, kind, c, r){
  const spin = Math.round(rng(p.slug+'::spin')()*360);
  /* buds all share a colour on purpose — twenty-four different greens would
     compete with the six flowers that are meant to be the subject */
  const B = ['#AFC894','#BCD2A2','#A8C48A','#C6DAAE','#6F8E56'];
  const [throat, inner, petal, rim, vein] = kind === 'bud' ? B : PALETTE[c];

  /* Its own gradient, because the whole point is that the colour is not
     flat: it sits deep in the throat and opens out towards the rim. The
     id has to be unique or every flower on the page borrows the first
     one's colours. */
  const id = 'w-' + p.slug;
  return `<svg viewBox="0 0 100 100" class="bloom"
       style="--throat:${throat};--inner:${inner};--petal:${petal};
              --rim:${rim};--vein:${vein};--spin:${spin}deg">
    <defs>
      <!-- userSpaceOnUse, not the default. On the default every petal gets
           its own little gradient centred on itself, which is exactly wrong:
           a flower has ONE throat and the colour opens out from it. -->
      <radialGradient id="${id}" gradientUnits="userSpaceOnUse"
                      cx="50" cy="50" r="46">
        <stop offset="0%"   stop-color="${throat}"/>
        <stop offset="17%"  stop-color="${throat}"/>
        <stop offset="30%"  stop-color="${inner}"/>
        <stop offset="52%"  stop-color="${petal}"/>
        <stop offset="88%"  stop-color="${petal}"/>
        <stop offset="100%" stop-color="${rim}"/>
      </radialGradient>
    </defs>
    <g fill="url(#${id})">${BLOOMS[kind]()}</g>
  </svg>`;
}

const pager = null;

/* ---------- WRITING IT IN THE PAGE ----------
   Press `write` on any page and it becomes editable in place. Everything
   you change is kept in this browser straight away, so a reload doesn't
   lose it. `copy the code` hands you the block to paste into the file when
   you want it to be permanent for everyone, not just this browser. */

let EDIT = false;
let BLOCKS = [];
let CURRENT = null;
let SEL = -1;          // the block the buttons act on

const FONTS = {body:'--body', narrow:'--ui', serif:'--note', hand:'--hand'};
const FONT_ORDER = ['body','narrow','serif','hand'];
const RATIOS = ['auto','4/5','1/1','3/2','16/9','3/4'];

/* ---- keeping it ----------------------------------------------------
   Two layers, because the first one is not always there.

   1. the browser's own memory. Instant, but a browser opening a file
      straight off the disk will often refuse it, and a preview pane
      inside another app throws it away the moment it closes. So it is
      TESTED, not assumed, and if it isn't working the page says so out
      loud instead of pretending.

   2. `save this page`. Writes out a whole fresh copy of this file with

/* a real test: write something, read it back, take it away again */
const CAN_KEEP = (()=>{
  try{
    localStorage.setItem('bouquet:probe','1');

    localStorage.removeItem('bouquet:probe');

})();

const kept = p => { try{ return localStorage.getItem('bouquet:'+p.slug); }catch(e){ return null; } };

const keyFor = p => 'bouquet:' + p.slug;
function save(){
  if(!CURRENT) return;

    localStorage.setItem(keyFor(CURRENT), JSON.stringify(BLOCKS));

  }catch(e){ ok = false; }
  const dot = app.querySelector('.saved');
  if(dot){
    dot.textContent = ok ? 'kept' : 'not kept — use save this page';
    dot.classList.toggle('bad', !ok);

  }
}
function load(p){

    if(raw){
      const saved = JSON.parse(raw);
      /* Preserve local edits, but migrate the one Siddharth link added
         after those edits may have been saved in this browser. */
      if(p.slug === 'siddharth'){
        const oldReach = 'you can reach out to him yourself!';
        const linkedReach = 'you can <a href="https://x.com/itsiddharth_" target="_blank" rel="noopener noreferrer">reach</a> out to him yourself!';
        let changed = false;
        saved.forEach(b => {
          if(typeof b.p === 'string' && b.p.includes(oldReach)){
            b.p = b.p.replace(oldReach, linkedReach);
            changed = true;
          }
        });
        if(changed){
          try{ localStorage.setItem(keyFor(p), JSON.stringify(saved)); }catch(e){}
        }
      }
      return saved;
    }
  }catch(e){}

}

/* ---- save this page -------------------------------------------------
   SOURCE is this file exactly as it was before anything was drawn — see
   the bottom of the script. To save, we find this person's story in that
   text, swap in what you've written, and hand the whole file back. */
let SOURCE = '';

/* walk the brackets to find where `story:[ … ]` ends, minding the fact
   that the writing itself is full of quotes and backticks */
function storySpan(src, slug){
  const at = src.indexOf('slug:"' + slug + '"');
  if(at < 0) return null;
  const s = src.indexOf('story:[', at);
  if(s < 0) return null;
  let i = s + 6, depth = 0, q = null;
  for(; i < src.length; i++){
    const c = src[i];
    if(q){ if(c === '\\') i++; else if(c === q) q = null; continue; }
    if(c === '"' || c === "'" || c === '`'){ q = c; continue; }
    if(c === '[') depth++;
    else if(c === ']'){ depth--; if(!depth){ i++; break; } }
  }
  return depth === 0 ? [s, i] : null;
}

function saveCopy(){
  harvest();
  const span = SOURCE && CURRENT ? storySpan(SOURCE, CURRENT.slug) : null;
  if(!span){ showCode(); return false; }   // couldn't do it cleanly — fall back
  const out = SOURCE.slice(0, span[0]) + storyCode() + SOURCE.slice(span[1]);
  try{
    const url = URL.createObjectURL(new Blob([out], {type:'text/html'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'interviews.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    const dot = app.querySelector('.saved');
    if(dot){ dot.classList.remove('bad');
             dot.textContent = 'saved — replace your old interviews.html with it';
             clearTimeout(save._t);
             save._t = setTimeout(()=>{ if(dot) dot.textContent=''; }, 6000); }
    return true;
  }catch(e){ showCode(); return false; }
}

/* NB: <a> is deliberately left alone in here — anything not named survives,
   and links must. */
const tidy = html => html
  .replace(/<b>/g,'<strong>').replace(/<\/b>/g,'</strong>')
  .replace(/<i>/g,'<em>').replace(/<\/i>/g,'</em>')
  .replace(/<div>/g,'<br>').replace(/<\/div>/g,'')
  .replace(/<font[^>]*>|<\/font>/g,'')
  .replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();

const numOf = v => Math.round(parseFloat(v)*10)/10;

/* The photographs strewn through the columns belong to the person's record,
   not to the writing, so everything that counts blocks has to step over
   them — otherwise reading the page back turns a photograph into a
   paragraph of markup and the save is corrupted. */
const partsOf = host => [...host.children].filter(el =>
  !el.classList.contains('ghostline') &&
  !el.classList.contains('dropline') &&
  !el.classList.contains('plate'));

/* The writing can be split across two boxes — the opening paragraphs beside
   the headline, the rest in the columns. Everything that counts or indexes
   blocks works off this, so the split is invisible to the editor. */
const allParts = () => [...app.querySelectorAll('.story')].flatMap(partsOf);

/* read the page back into the blocks */
function harvest(){
  if(!app.querySelector('.story')) return;
  BLOCKS = allParts().map(el=>{
    if(el.classList.contains('fig')){
      const b = {img: el.dataset.src};
      if(el.dataset.alt) b.alt = el.dataset.alt;
      const note = el.querySelector('.note');
      if(note){
        const c = note.cloneNode(true);
        c.querySelectorAll('svg,.grip').forEach(n=>n.remove());
        b.note = tidy(c.innerHTML);
      }
      b.side  = (/side-(\w+)/.exec(el.className)||[,'right'])[1];
      const w = el.style.getPropertyValue('--figw'); if(w) b.width = w;
      b.ratio = el.dataset.ratio || 'auto';
      b.fx = numOf(el.dataset.fx || 50);  b.fy = numOf(el.dataset.fy || 50);
      b.zoom = numOf(el.dataset.zoom || 1);
      b.nx = numOf(el.style.getPropertyValue('--nx') || -30);
      b.ny = numOf(el.style.getPropertyValue('--ny') || 52);
      b.nrot = numOf(el.style.getPropertyValue('--nrot') || -4);
      b.tx = numOf(el.dataset.tx || 18); b.ty = numOf(el.dataset.ty || 48);
      if(!el.querySelector('.arrowlayer')) b.arrow = false;
      return b;
    }
    if(el.classList.contains('cap')){
      return {box: tidy(el.querySelector('.captext').innerHTML),
              x: numOf(el.style.left), y: numOf(el.style.top),
              w: numOf(el.style.width), rot: numOf(el.style.getPropertyValue('--rot')||0),
              font: el.dataset.font || 'hand', size: numOf(el.style.fontSize || 19),
              tone: el.dataset.tone || 'red'};
    }
    const b = {p: tidy(el.innerHTML)};
    if(el.dataset.font && el.dataset.font!=='body') b.font = el.dataset.font;
    if(el.style.fontSize) b.size = numOf(el.style.fontSize);
    if(el.style.maxWidth) b.w = numOf(el.style.maxWidth);
    return b;
  });
  save();
}

function storyCode(){
  const q = s => String(s).replace(/`/g,'\\`');
  const esc1 = s => String(s||'').replace(/'/g,"\\'");
  return 'story:[\n' + BLOCKS.map(b=>{
    if(b.img !== undefined) return `      { img:'${b.img}',${b.alt?` alt:'${esc1(b.alt)}',`:''}\n` +
      `        note:'${esc1(b.note)}', side:'${b.side||'right'}'${b.width?`, width:'${b.width}'`:''},\n` +
      `        ratio:'${b.ratio||'auto'}', fx:${b.fx??50}, fy:${b.fy??50}, zoom:${b.zoom??1},\n` +
      `        nx:${b.nx??-30}, ny:${b.ny??52}, nrot:${b.nrot??-4},\n` +
      `        tx:${b.tx??18}, ty:${b.ty??48}${b.arrow===false?', arrow:false':''} },`;
    if(b.box !== undefined) return `      { box:\`${q(b.box)}\`, x:${b.x}, y:${b.y}, w:${b.w},\n` +
      `        rot:${b.rot||0}, font:'${b.font||'hand'}', size:${b.size||19}, tone:'${b.tone||'red'}' },`;
    return '      { p:`' + q(b.p) + '`' +
      (b.font?`, font:'${b.font}'`:'') + (b.size?`, size:${b.size}`:'') +
      (b.w?`, w:${b.w}`:'') + ' },';
  }).join('\n\n') + '\n    ]';
}

function showCode(){
  const code = storyCode();
  try{ navigator.clipboard && navigator.clipboard.writeText(code); }catch(e){}
  const box = app.querySelector('#codebox');
  if(box){ box.value = code; box.hidden = false; box.select(); }
}
