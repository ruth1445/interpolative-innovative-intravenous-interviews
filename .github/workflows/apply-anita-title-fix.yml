name: Apply Anita title fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-anita-title-fix.yml'
      - 'scripts/tweak_anita_layout.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Anita layout correction
        run: python scripts/tweak_anita_layout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.jpg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Correct Anita title art and favicon [skip ci]"
          git push
