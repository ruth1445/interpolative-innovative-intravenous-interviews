name: Keep Anita mobile image beside title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-anita-mobile-title-side.yml'
      - 'scripts/fix_anita_mobile_title_side.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep image beside title on mobile
        run: python scripts/fix_anita_mobile_title_side.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Keep Anita mobile title image beside headline [skip ci]"
          git push
