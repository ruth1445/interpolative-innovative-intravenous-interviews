name: Refine Anita magazine layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-anita-magazine.yml'
      - 'scripts/refine_anita_magazine.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Anita magazine composition
        run: python scripts/refine_anita_magazine.py
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refine Anita vintage magazine layout [skip ci]"
          git push
