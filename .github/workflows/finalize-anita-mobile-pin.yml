name: Finalize Anita mobile title image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-anita-mobile-pin.yml'
      - 'scripts/finalize_anita_mobile_pin.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile title image override
        run: python scripts/finalize_anita_mobile_pin.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finalize Anita mobile title image sizing [skip ci]"
          git push
