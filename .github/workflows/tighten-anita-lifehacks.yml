name: Tighten Anita life hacks spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-anita-lifehacks.yml'
      - 'scripts/tighten_anita_lifehacks.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten Anita life hacks spacing
        run: python scripts/tighten_anita_lifehacks.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Tighten Anita life hacks spacing [skip ci]"
          git push
