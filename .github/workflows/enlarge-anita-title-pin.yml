name: Enlarge Anita title pin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enlarge-anita-title-pin.yml'
      - 'scripts/enlarge_anita_title_pin.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge Anita title image
        run: python scripts/enlarge_anita_title_pin.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Enlarge Anita title image to 2.3in [skip ci]"
          git push
