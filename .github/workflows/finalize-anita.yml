name: Finalize Anita writeup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-anita.yml'
      - 'scripts/finalize_anita.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Anita article
        run: python scripts/finalize_anita.py
      - name: Commit final writeup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish Anita final writeup [skip ci]"
          git push
