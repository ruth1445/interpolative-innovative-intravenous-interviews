name: Fix Anita panel spacing v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-anita-panel-spacing-v2.yml'
      - 'scripts/fix_anita_panel_spacing_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Anita final panel spacing fix
        run: python scripts/fix_anita_panel_spacing_v2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Anita final box spacing [skip ci]"
          git push
