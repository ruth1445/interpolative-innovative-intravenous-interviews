name: Tune Anita final copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-anita-final.yml'
      - 'scripts/tune_anita_final.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Anita copy tweaks
        run: python scripts/tune_anita_final.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Polish Anita final copy [skip ci]"
          git push
