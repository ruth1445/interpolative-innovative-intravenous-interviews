name: Sync uploaded index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-uploaded-index.yml'
      - 'scripts/sync_uploaded_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply uploaded index changes
        run: python scripts/sync_uploaded_index.py
      - name: Commit exact synced index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync uploaded index.html [skip ci]"
          git push
