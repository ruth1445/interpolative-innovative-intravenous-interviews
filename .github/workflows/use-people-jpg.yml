name: Use people.jpg for Anita title image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-people-jpg.yml'
      - 'scripts/use_people_jpg.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Anita title image to people.jpg
        run: python scripts/use_people_jpg.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use people.jpg for Anita title image [skip ci]"
          git push
