name: Fix Anita final layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-anita-final.yml'
      - 'scripts/fix_anita_final.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Anita layout
        run: python scripts/fix_anita_final.py
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Anita photo flow and cache [skip ci]"
          git push
